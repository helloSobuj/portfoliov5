<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Techill অ্যাডমিন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap">
<style>
/* Layout: sticky header with live pill; left section nav (horizontal on mobile); one section visible at a time:
   overview (alerts, KPI tiles, charts, funnel, pipeline, team, activity), orders table + side drawer, project board,
   visitors, package & price editor, team, customers */
:root{
  --bg:#f7f9fc;--surface:#ffffff;--sunk:#eef3f9;--ink:#121822;--muted:#5a6578;--line:#e1e7ef;--grid:#edf1f6;
  --blue:#0a84f0;--blue-ink:#0067c7;--blue-soft:#e8f3ff;--on-blue:#ffffff;
  --ok:#12a150;--ok-soft:#e4f6eb;--warn:#a85800;--warn-soft:#fff3e0;--danger:#d93025;--danger-soft:#fdecea;
  --shadow:0 1px 2px rgb(16 24 40 / .04),0 18px 40px -18px rgb(16 24 40 / .16);
  --font:"Tiro Bangla","Noto Serif Bengali",Georgia,serif;
  --r:18px;
}
:root[data-theme="dark"]{
  --bg:#0b1018;--surface:#111925;--sunk:#0e1520;--ink:#e9eef5;--muted:#98a4b7;--line:#1f2b3b;--grid:#18222f;
  --blue:#3aa0ff;--blue-ink:#7cc0ff;--blue-soft:#10223a;--on-blue:#04121f;
  --ok:#3ccf7f;--ok-soft:#0f2a1c;--warn:#ffb454;--warn-soft:#2c1f0c;--danger:#ff6b60;--danger-soft:#2d1311;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 18px 40px -18px rgb(0 0 0 / .6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:700}
p{margin:0}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.logo{display:block;height:34px;width:auto}
.logo-d{display:none}
:root[data-theme="dark"] .logo-l{display:none}
:root[data-theme="dark"] .logo-d{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 18px;font-weight:600;text-decoration:none;cursor:pointer;border:1.5px solid transparent;transition:transform .15s,border-color .15s;white-space:nowrap;background:transparent}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--blue);color:var(--on-blue)}
.btn-ghost{border-color:var(--line)}
.btn-ghost:hover{border-color:var(--blue)}
.btn-danger{border-color:var(--danger);color:var(--danger)}
.btn-ok{background:var(--ok);color:#fff}
.btn-sm{padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:19px;height:19px}
.theme-btn .moon{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .moon{display:block}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.b-unread{background:var(--danger);color:#fff;min-width:22px;justify-content:center;padding:1px 7px}
.b-pending{background:var(--warn-soft);color:var(--warn)}
.b-verified,.b-done{background:var(--ok-soft);color:var(--ok)}
.b-rejected,.b-late{background:var(--danger-soft);color:var(--danger)}
.b-run,.b-admin{background:var(--blue-soft);color:var(--blue-ink)}
.b-cancel,.b-off{background:var(--sunk);color:var(--muted)}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px;padding-inline:24px;max-width:1440px;margin:0 auto}
.hdr-l,.hdr-r{display:flex;align-items:center;gap:12px;min-width:0}
.tag{font-size:.8rem;font-weight:600;color:var(--blue-ink);background:var(--blue-soft);border-radius:8px;padding:2px 10px}
.live-pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:.9rem;cursor:pointer}
.live-pill b{font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 1.8s ease-out infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}}
.demo-bar{background:var(--warn-soft);color:var(--warn);font-size:.88rem;text-align:center;padding:7px 16px}
.demo-bar b{color:var(--ink)}
.demo-bar button{all:unset;cursor:pointer;text-decoration:underline;margin-left:6px}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;max-width:1440px;margin:0 auto;padding:24px 24px 72px}
.nav{position:sticky;top:88px;align-self:start;display:grid;gap:2px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--blue-soft);color:var(--blue-ink)}
.nav button svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto}
.nav hr{border:0;border-top:1px solid var(--line);margin:10px 4px}
.nav a{display:flex;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.94rem}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a svg{width:18px;height:18px;flex:none}
main{min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-h h1{font-size:1.6rem}
.sec-h p{color:var(--muted);margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:5px 14px;font-weight:600;cursor:pointer;color:var(--muted);font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.card h3{font-size:1.05rem}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card .ch small{color:var(--muted);font-size:.85rem}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}

/* alerts */
.alerts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.alert{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;cursor:pointer;text-align:left;font-size:.93rem}
.alert b{font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-soft)}
.alert.bad{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));background:var(--danger-soft)}
.alert.good{background:var(--ok-soft);border-color:transparent;cursor:default}
.alert svg{width:18px;height:18px;flex:none}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:4px;min-width:0}
.tile .l{color:var(--muted);font-size:.86rem;display:flex;align-items:center;gap:8px}
.tile .v{font-size:1.85rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{color:var(--muted);font-size:.82rem}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:220px;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .bar{fill:var(--blue)}
.chart .bar.dim{fill:color-mix(in srgb,var(--blue) 35%,var(--surface))}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hl{fill:var(--blue-ink)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 11px;font-size:.84rem;line-height:1.35;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));box-shadow:var(--shadow);z-index:5}
.tip b{font-variant-numeric:tabular-nums}
details.tv{margin-top:10px;font-size:.88rem}
details.tv summary{cursor:pointer;color:var(--muted)}
details.tv table{margin-top:8px}
.hb{display:grid;gap:10px}
.hb-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:12px;align-items:center;font-size:.92rem}
.hb-row .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-track{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.hb-track i{display:block;height:100%;background:var(--blue);border-radius:0 4px 4px 0;min-width:3px}
.hb-row .n{font-variant-numeric:tabular-nums;font-weight:600;min-width:48px;text-align:right}
.hb-row .n small{color:var(--muted);font-weight:400}

/* lists */
.feed{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:480px;overflow-y:auto}
.feed li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 6px;border-radius:10px;cursor:pointer}
.feed li:hover{background:var(--sunk)}
.feed .fi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.feed .fi.m{background:var(--ok-soft);color:var(--ok)}
.feed .fi svg{width:15px;height:15px}
.feed p{font-size:.9rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed small{color:var(--muted);font-size:.78rem}
.people{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.people li{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;font-weight:700;font-size:.95rem;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:30px;height:30px;font-size:.8rem}
.av.lg{width:84px;height:84px;font-size:1.8rem}
.who-cell{display:flex;align-items:center;gap:10px;min-width:0}
.who-cell > div{min-width:0}
.me-btn{border:0;background:transparent;padding:2px;border-radius:50%;cursor:pointer}
.tpl-img{width:64px;height:80px;border-radius:8px;object-fit:cover;object-position:top;border:1px solid var(--line);display:block;background:var(--sunk)}
.tpl-ph{width:64px;height:80px;border-radius:8px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:.72rem;text-align:center;line-height:1.2}
.photo-row{display:flex;gap:14px;align-items:center}
.people small{color:var(--muted);display:block;font-size:.8rem}

/* tables */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:.8rem;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--sunk)}
.tbl .r{text-align:right}
.tbl .sub{display:block;color:var(--muted);font-size:.78rem}
.tbl select{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:4px 8px;max-width:170px}
.late{color:var(--danger);font-weight:600}
.mini{height:5px;width:70px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;background:var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:3px 13px;font-size:.86rem;cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{border-color:var(--blue);color:var(--blue-ink);background:var(--blue-soft);font-weight:600}
.search{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;outline:none;min-width:220px}
.search:focus{border-color:var(--blue)}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:16px;padding:12px;display:grid;gap:10px;align-content:start;min-height:200px}
.col h3{font-size:.95rem;display:flex;justify-content:space-between;padding:2px 4px}
.kc{all:unset;box-sizing:border-box;display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-size:.88rem}
.kc:hover{border-color:var(--blue)}
.kc.late{border-color:color-mix(in srgb,var(--danger) 55%,var(--line))}
.kc .t{display:flex;justify-content:space-between;gap:6px}
.kc small{color:var(--muted)}
.kc .mini{width:100%}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgb(8 12 20 / .45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:var(--shadow);border-left:1px solid var(--line)}
.dr-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;z-index:2}
.dr-h h2{font-size:1.3rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dr-h p{color:var(--muted);font-size:.9rem}
.dr-b{padding:18px 20px 40px;display:grid;gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.box h4{font-size:.95rem;margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;word-break:break-word}
.lines{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.9rem}
.lines li{display:flex;justify-content:space-between;gap:12px}
.lines li.t{border-top:1.5px dashed var(--line);padding-top:8px;font-weight:700}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f{display:grid;gap:5px;min-width:0}
.f label{font-weight:600;font-size:.86rem}
.f label small{font-weight:400;color:var(--muted)}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;outline:none;min-width:0}
.inp:focus{border-color:var(--blue)}
textarea.inp{resize:vertical;min-height:84px}
.err{color:var(--danger);font-size:.86rem;min-height:1.2em}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:.88rem}
.tl li{border-left:2px solid var(--line);padding-left:12px}
.tl small{color:var(--muted);display:block}
.tl p{white-space:pre-wrap}

/* catalog editor */
.ed-sec{display:grid;gap:14px;margin-bottom:22px}
.ed-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ed-grid .w2{grid-column:span 2}
.ed-grid .w4{grid-column:1/-1}
.packs-ed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pk{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;align-content:start}
.pk .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pk .g2i{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk .g3i{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.86rem}
.checks label{display:flex;gap:6px;align-items:center;font-weight:400}
.sw{display:flex;gap:6px;align-items:center;font-size:.88rem;font-weight:600}
.tbl input.inp,.tbl select.inp{padding:6px 8px;font-size:.88rem}
.savebar{position:sticky;bottom:16px;z-index:5;display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:12px 16px;margin-top:10px;flex-wrap:wrap}

/* counts strip, analytics */
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.cnt-card{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;background:var(--blue-soft);border-radius:14px;padding:12px 16px;cursor:pointer;color:var(--blue-ink);min-width:0}
.cnt-card:hover{outline:1.5px solid var(--blue)}
.cnt-card svg{width:26px;height:26px;flex:none}
.cnt-card span{display:grid;line-height:1.3;color:var(--ink);min-width:0}
.cnt-card b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.cnt-card small{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.atabs button{display:flex;gap:8px;align-items:center;border:0;background:transparent;padding:10px 18px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.atabs button svg{width:17px;height:17px}
.atabs button[aria-selected="true"]{color:var(--blue-ink);border-bottom-color:var(--blue)}
.sub-h{font-size:1.1rem;margin:6px 0 12px;display:flex;gap:8px;align-items:center}
.sub-h svg{width:19px;height:19px;color:var(--blue)}
.dl{font-weight:700}
.dl.up{color:var(--ok)}
.dl.dn{color:var(--danger)}
.tile .s .muted{font-size:.8rem}

/* switch, radio segments, steps */
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:.92rem;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch span{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform .15s}
.switch input:checked + span{background:var(--ok)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{outline:2px solid var(--blue);outline-offset:2px}
.seg-r{position:relative;cursor:pointer}
.seg-r input{position:absolute;opacity:0}
.seg-r span{display:block;border-radius:9px;padding:6px 14px;font-weight:600;color:var(--muted);font-size:.9rem}
.seg-r input:checked + span{background:var(--blue);color:var(--on-blue)}
.seg-r input:focus-visible + span{outline:2px solid var(--blue)}
.steps-ol{margin:0;padding-left:20px;display:grid;gap:8px;font-size:.92rem}

/* auth */
.auth{display:grid;place-items:center;padding:72px 16px}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:30px;display:grid;gap:14px}
.auth-card h1{font-size:1.5rem}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.92rem;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:1180px){
  .tiles,.counts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-main,.g3{grid-template-columns:1fr 1fr}
  .packs-ed{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){

/* ---------- charts ---------- */
// Single-series column chart with hover tooltip; values in ink, bars in the brand blue.
function columns(rows, val, fmt, label, xlab = r => dayLabel(r.d), every0){
  const W = 640, H = 220, P = {l: 44, r: 8, t: 10, b: 26};
  const max = Math.max(1, ...rows.map(val)), nice = niceMax(max), n = rows.length;
  const cw = (W - P.l - P.r) / n, bw = Math.max(2, Math.min(28, cw - 2));
  const y = v => H - P.b - (v / nice) * (H - P.t - P.b);
  const ticks = [0, .5, 1].map(f => f * nice);
  const every = every0 || Math.ceil(n / 7);
  const id = "c" + Math.random().toString(36).slice(2, 8);
  const bars = rows.map((r, i) => {
    const v = val(r), x = P.l + i * cw + (cw - bw) / 2, yt = y(v), h = H - P.b - yt, rad = Math.min(4, bw / 2, h);
    const path = h > 0 ? `M${x},${H - P.b}V${yt + rad}Q${x},${yt} ${x + rad},${yt}H${x + bw - rad}Q${x + bw},${yt} ${x + bw},${yt + rad}V${H - P.b}Z` : "";
    return `<g>${path ? `<path class="bar" d="${path}"/>` : ""}<rect class="hit" x="${P.l + i * cw}" y="${P.t}" width="${cw}" height="${H - P.t - P.b}" data-i="${i}"/></g>`;
  }).join("");
  const xl = rows.map((r, i) => i % every === 0 || (!every0 && i === n - 1) ? `<text class="ax" x="${P.l + i * cw + cw / 2}" y="${H - 8}" text-anchor="middle">${xlab(r)}</text>` : "").join("");
  const yl = ticks.map(t => `<line class="gl" x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${P.l - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t, true)}</text>`).join("");
  setTimeout(() => {
    const el = document.getElementById(id); if (!el) return;
    el.addEventListener("mousemove", e => {
      const h = e.target.closest(".hit"); const tip = $("tip");
      el.querySelectorAll(".hl").forEach(b => b.classList.remove("hl"));
      if (!h){ tip.hidden = true; return; }
      const r = rows[+h.dataset.i]; h.previousElementSibling?.classList.add("hl");
      tip.innerHTML = `${xlab(r)}<br><b>${fmt(val(r))}</b> ${label}`; tip.hidden = false;
      const bb = h.getBoundingClientRect(); tip.style.left = (bb.left + bb.width / 2 + scrollX) + "px"; tip.style.top = (e.clientY + scrollY - 6) + "px";
      tip.style.position = "absolute";
    });
    el.addEventListener("mouseleave", () => { $("tip").hidden = true; el.querySelectorAll(".hl").forEach(b => b.classList.remove("hl")); });
  });
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${label}, দিনভিত্তিক">${yl}${bars}${xl}</svg></div>

}

  $("drClose").addEventListener("click", closeDrawer); $("drClose").focus();

/* ---------- board ---------- */
function renderBoard(){
  const list = orders.filter(o => !o.cancelled).filter(o => !boardDev || String(o.developer?.id || "none") === boardDev);
  const run = list.filter(o => o.stage < 4);
  $("main").innerHTML = `
    <div class="sec-h"><div><h1>প্রোজেক্ট বোর্ড</h1><p>${nf(run.length)}টা চলমান · ${nf(run.filter(isLate).length)}টা দেরি হচ্ছে</p></div>
      <div class="tools"><select class="search" id="boardDev" style="min-width:0" aria-label="ডেভেলপার"><option value="">সব ডেভেলপার</option><option value="none" ${boardDev === "none" ? "selected" : ""}>অ্যাসাইন হয়নি</option>${team.map(t => `<option value="${t.id}" ${boardDev === String(t.id) ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select></div></div>
    <div class="board">${STAGES.map((st, i) => {
      let col = list.filter(o => o.stage === i).sort((a, b) => a.deadline - b.deadline);
      const more = i === 4 && col.length > 8 ? col.length - 8 : 0; if (i === 4) col = col.sort((a, b) => b.created - a.created).slice(0, 8);
      return `<div class="col"><h3><span>${st}</span><span class="muted">${BN(list.filter(o => o.stage === i).length)}</span></h3>
        ${col.map(o => `<button type="button" class="kc ${isLate(o) ? "late" : ""}" data-open="${o.id}">
          <span class="t"><b>${esc(o.code)}</b>${o.unread ? `<span class="badge b-unread">${BN(o.unread)}</span>` : o.pay_status !== "verified" ? `<span class="badge b-${o.pay_status}">${PAY[o.pay_status]}</span>` : ""}</span>
          <span>${esc(o.customer?.name)} · ${esc(o.pack)}</span>
          <small>${o.developer ? esc(o.developer.name) : '<span class="late">ডেভেলপার নেই</span>'}</small>
          <span class="mini"><i style="width:${o.progress}%"></i></span>
          <small class="${isLate(o) ? "late" : ""}">${i === 4 ? "ডেলিভারি সম্পন্ন" : left(o.deadline)}</small>
        </button>`).join("") || '<p class="muted" style="font-size:.86rem;padding:4px">খালি</p>'}${more ? `<small class="muted">আরও ${BN(more)}টা</small>` : ""}</div>`;
    }).join("")}</div>`;
}

  }
  if (e.target.closest("#catSave")){
    const clean = structuredClone(draft); clean.addons.forEach(a => delete a._new);

      ${rows.length ? `<div class="tbl-wrap"><table class="tbl" style="min-width:860px"><thead><tr><th>সময়</th><th>অর্ডার</th><th>কাস্টমার</th><th class="r">টাকা</th><th>অবস্থা</th><th>মাধ্যম</th><th>TrxID</th><th>নোট</th></tr></thead><tbody>
        ${rows.map(r => `<tr class="click" data-open="${r.order_id}"><td>${when(r.created)}</td><td><b>${esc(r.code)}</b><span class="sub">${esc(r.invoice)}</span></td><td>${esc(r.customer)}</td><td class="r num">${tk(r.amount)}</td>
          <td>${pstat(r.status)}${r.sandbox ? ' <span class="badge b-pending">Sandbox</span>' : ""}</td><td>${esc(r.method || "—")}<span class="sub">${esc(r.payer || "")}</span></td><td>${esc(r.trx_id || "—")}</td><td class="muted" style="max-width:220px">${esc(r.note || "")}</td></tr>`).join("")}
      </tbody></table></div>` : '<p class="empty">এখনো কোনো অনলাইন পেমেন্ট হয়নি।</p>'}</div>`;
  $("psForm").addEventListener("submit", async e => {
    e.preventDefault(); $("psErr").textContent = "";
    const f = new FormData(e.target), data = {ps_merchant_id: f.get("ps_merchant_id"), ps_password: f.get("ps_password") || ""};
    if (f.get("ps_enabled")) data.ps_enabled = 1;
    if (f.get("ps_mode") === "sandbox") data.ps_sandbox = 1;
    if (f.get("ps_pay_with_charge")) data.ps_pay_with_charge = 1;
    if (f.get("manual_enabled")) data.manual_enabled = 1;
    if (data.ps_enabled && !data.ps_sandbox && pset.paystation.sandbox && !confirm("Live মোড চালু করছেন। এখন থেকে কাস্টমারের আসল টাকা কাটবে। Live-এর Merchant ID আর পাসওয়ার্ড দিয়েছেন তো?")) return;
    try { pset = (await api.savePaymentSettings(data)).settings; ptest = null; renderPayments(); toast(pset.paystation.ready ? "সেভ হয়েছে। চেকআউটে অনলাইন পেমেন্ট দেখাচ্ছে।" : "সেভ হয়েছে। অনলাইন পেমেন্ট বন্ধ আছে।"); }
    catch(err){ $("psErr").textContent = err.message; }
  });
  $("psClear")?.addEventListener("click", async () => {
    if (!confirm("সেভ করা পাসওয়ার্ড মুছবেন? অনলাইন পেমেন্ট বন্ধ হয়ে যাবে।")) return;
    try { pset = (await api.savePaymentSettings({ps_merchant_id: p.merchant_id, ps_sandbox: p.sandbox ? 1 : "", ps_pay_with_charge: p.pay_with_charge ? 1 : "", manual_enabled: 1, ps_clear_password: 1})).settings; renderPayments(); } catch(err){ toast(err.message); }
  });
  $("psTest")?.addEventListener("click", async () => {
    const b = $("psTest"); b.disabled = true; b.textContent = "পরীক্ষা হচ্ছে...";
    try {
      const r = await api.paymentTest();
      ptest = !r.reachable ? {ok: false, text: "PayStation-এ পৌঁছানো যায়নি: " + r.message}
        : r.status_code === "200" || r.status_code === "2001" ? {ok: true, text: `PayStation-এ সংযোগ ঠিক আছে (${r.sandbox ? "Sandbox" : "Live"})। Merchant ID চেনা গেছে কিনা নিশ্চিত হতে একটা ছোট পরীক্ষামূলক পেমেন্ট করে দেখুন। PayStation বলেছে: ${r.message || r.status_code}`}
        : {ok: false, text: `PayStation উত্তর দিয়েছে কোড ${r.status_code}: ${r.message}`};
    } catch(err){ ptest = {ok: false, text: err.message}; }
    renderPayments();
  });
  $("cbCopy").addEventListener("click", async () => { try { await navigator.clipboard.writeText(pset.callback_url); toast("কপি হয়েছে।"); } catch(e){ $("cbUrl").select(); } });
}

function renderMe(){

  if (t) me.avatar = t.avatar;
  $("meBtn").innerHTML = avatarHTML(me.name, me.avatar); $("meBtn").hidden = false;
}

$("main").addEventListener("click", async e => {
  if (sec !== "referral") return;
  const f = e.target.closest("[data-rf]"); if (f){ rFilter = f.dataset.rf; return renderReferral(); }
  const done = async (p, msg) => { try { rdata = await p; renderReferral(); toast(msg); stats = await api.stats(days).catch(() => stats); renderNav(); } catch(err){ toast(err.message); } };
  const paid = e.target.closest("[data-paid]");
  if (paid){ const id = paid.dataset.paid, trx = document.querySelector(`[data-trx="${id}"]`).value.trim(); if (!trx){ toast("যে TrxID দিয়ে টাকা পাঠিয়েছেন সেটা দিন।"); document.querySelector(`[data-trx="${id}"]`).focus(); return; } return done(api.payoutOp({id, op: "paid", trx}), "পেমেন্ট সম্পন্ন হিসেবে রাখা হয়েছে। কাস্টমারকে ইমেইলে জানানো হবে।"); }
  const rej = e.target.closest("[data-prej]");
  if (rej){ const note = prompt("কেন বাতিল করছেন? কাস্টমার এই কারণটা দেখবেন।"); if (!note) return; return done(api.payoutOp({id: rej.dataset.prej, op: "rejected", note}), "অনুরোধ বাতিল হয়েছে, টাকা কাস্টমারের ব্যালেন্সে ফিরে গেছে।"); }
  const rr = e.target.closest("[data-rreject]");
  if (rr){ e.stopPropagation(); const note = prompt("কেন বাতিল করছেন? (যেমন: নিজের আরেকটা অ্যাকাউন্ট)"); if (note === null) return; return done(api.referralOp({id: rr.dataset.rreject, op: "reject", note}), "রেফারেল বাতিল হয়েছে।"); }
  const rs = e.target.closest("[data-rrestore]");
  if (rs){ e.stopPropagation(); return done(api.referralOp({id: rs.dataset.rrestore, op: "restore"}), "রেফারেল আবার চালু হয়েছে।"); }
}, true);

        ${p.avatar ? '<button class="btn btn-ghost btn-sm" type="button" id="pPhotoDel">সরান</button>' : ""}</div></div></div>` : ""}
      ${!isNew ? `<div class="box"><dl class="kv">
        ${cust ? `<dt>অর্ডার</dt><dd>${BN(p.orders)}টা · ${BN(p.running)}টা চলমান</dd><dt>মোট পেমেন্ট</dt><dd>${tk(p.spent)}</dd><dt>শেষ অর্ডার</dt><dd>${p.last_order ? ago(p.last_order) : "—"}</dd>`
               : `<dt>রোল</dt><dd>${p.role === "admin" ? "অ্যাডমিন" : "ডেভেলপার"}</dd><dt>চলমান প্রোজেক্ট</dt><dd>${BN(p.running)}${p.overdue ? ` · <span class="late">${BN(p.overdue)}টা দেরি</span>` : ""}</dd><dt>সম্পন্ন</dt><dd>${BN(p.done)}টা</dd>`}
        <dt>যোগ দিয়েছেন</dt><dd>${dateOnly(p.created)}</dd><dt>অবস্থা</dt><dd>${p.active ? '<span class="badge b-done">সক্রিয়</span>' : '<span class="badge b-off">বন্ধ</span>'}</dd></dl>
        ${cust && p.orders ? `<div class="row2" style="margin-top:12px"><button class="btn btn-ghost btn-sm" type="button" id="pOrders">সব অর্ডার দেখুন</button></div>` : ""}</div>` : ""}
      <form class="box" id="pForm" style="display:grid;gap:12px"><h4>${isNew ? "তথ্য" : "তথ্য বদলান"}</h4>
        <div class="f"><label for="p-name">নাম</label><input class="inp" id="p-name" name="name" value="${esc(p?.name || "")}" required></div>
        <div class="f"><label for="p-email">ইমেইল <small>(লগইনের জন্য)</small></label><input class="inp" id="p-email" name="email" type="email" value="${esc(p?.email || "")}" required></div>
        ${cust ? `<div class="f"><label for="p-phone">মোবাইল <small>(ঐচ্ছিক)</small></label><input class="inp" id="p-phone" name="phone" type="tel" value="${esc(p?.phone || "")}" placeholder="01XXXXXXXXX"></div>` : ""}
        ${isNew ? `<div class="f"><label for="p-pass">পাসওয়ার্ড <small>(৮+ অক্ষর, পরে তাকে জানিয়ে দিন)</small></label><input class="inp" id="p-pass" name="password" type="text" minlength="8" required></div>` : ""}
        ${!cust && (isNew || !self) ? `<div class="f"><label for="p-role">রোল</label><select class="inp" id="p-role" name="role"><option value="developer" ${p?.role !== "admin" ? "selected" : ""}>ডেভেলপার</option><option value="admin" ${p?.role === "admin" ? "selected" : ""}>অ্যাডমিন</option></select></div>` : ""}
        <div class="row2"><button class="btn btn-primary" type="submit">${isNew ? "অ্যাকাউন্ট খুলুন" : "সেভ করুন"}</button></div>
        <p class="err" id="pErr" role="alert"></p></form>
      ${!isNew ? `<form class="box" id="pwForm" style="display:grid;gap:10px"><h4>পাসওয়ার্ড রিসেট</h4>
        <div class="row2"><input class="inp" name="password" type="text" minlength="8" placeholder="নতুন পাসওয়ার্ড (৮+ অক্ষর)" style="flex:1" aria-label="নতুন পাসওয়ার্ড" required><button class="btn btn-ghost btn-sm" type="submit">বদলান</button></div></form>
      ${self ? "" : `<div class="box"><h4>অ্যাকাউন্ট</h4>
        <p class="muted" style="font-size:.88rem;margin-bottom:10px">${cust ? "বন্ধ করলে তিনি আর লগইন করতে পারবেন না, তবে অর্ডার আর চ্যাট থেকে যাবে।" : "বন্ধ করলে তিনি লগইন করতে পারবেন না। মুছে ফেললে তার চলমান প্রোজেক্টগুলো আবার অ্যাসাইন করতে হবে।"}</p>
        <div class="row2"><button class="btn btn-ghost btn-sm" type="button" id="pToggle">${p.active ? "অ্যাকাউন্ট বন্ধ করুন" : "অ্যাকাউন্ট চালু করুন"}</button>
        <button class="btn btn-danger btn-sm" type="button" id="pDelete" ${ordersHere ? "disabled" : ""}>মুছে ফেলুন</button></div>
        ${ordersHere ? '<p class="muted" style="font-size:.82rem;margin-top:8px">এই কাস্টমারের অর্ডার আছে, তাই মোছা যাবে না (অর্ডার, চ্যাট আর ফাইল হারিয়ে যেত)। বদলে অ্যাকাউন্ট বন্ধ করুন।</p>' : ""}</div>`}` : ""}
    </div>`;
  $("drawer").hidden = false; $("drawerBg").hidden = false; $("drClose").addEventListener("click", closeDrawer); $("p-name").focus();
  const save = cust ? api.customerSave : api.teamSave;
  const done = async (r, msg) => {
    if (cust) customers = r.customers; else team = r.team;
    stats = await api.stats(days).catch(() => stats); renderNav(); render(); toast(msg);
  };
  $("pForm").addEventListener("submit", async e => {
    e.preventDefault(); $("pErr").textContent = "";
    const data = Object.fromEntries(new FormData(e.target));
    try {
      if (isNew){ await done(await save({op: "create", ...data}), cust ? "কাস্টমার যোগ হয়েছে।" : "টিম মেম্বার যোগ হয়েছে। তিনি dashboard.html থেকে লগইন করবেন।"); closeDrawer(); return; }
      let r = await save({op: "update", id: p.id, ...data});
      if (!cust && data.role && data.role !== p.role) r = await save({op: "role", id: p.id, role: data.role});
      await done(r, "সেভ হয়েছে।");
      openPerson(kind, (cust ? customers : team).find(x => x.id === p.id));
    } catch(err){ $("pErr").textContent = err.message; }
  });
  $("pwForm")?.addEventListener("submit", async e => {
    e.preventDefault();
    try { await save({op: "password", id: p.id, password: new FormData(e.target).get("password")}); e.target.reset(); toast("পাসওয়ার্ড বদলানো হয়েছে। নতুন পাসওয়ার্ডটা তাকে জানিয়ে দিন।"); } catch(err){ toast(err.message); }
  });
  $("pToggle")?.addEventListener("click", async () => {
    try { await done(await save({op: "toggle", id: p.id}), p.active ? "অ্যাকাউন্ট বন্ধ হয়েছে।" : "অ্যাকাউন্ট চালু হয়েছে।"); openPerson(kind, (cust ? customers : team).find(x => x.id === p.id)); } catch(err){ toast(err.message); }
  });
  $("pDelete")?.addEventListener("click", async () => {
    if (!confirm(`${p.name}-এর অ্যাকাউন্ট পুরোপুরি মুছে ফেলবেন? এটা ফেরানো যাবে না।`)) return;
    try {
      const r = await save({op: "delete", id: p.id});
      await done(r, r.unassigned ? `মুছে ফেলা হয়েছে। তার ${BN(r.unassigned)}টা চলমান প্রোজেক্ট এখন অ্যাসাইন ছাড়া, অর্ডার থেকে নতুন ডেভেলপার দিন।` : "মুছে ফেলা হয়েছে।");
      if (!cust) orders = (await api.orders()).orders;
      closeDrawer();
    } catch(err){ toast(err.message); }
  });
  const reopen = async () => {
    if (cust) customers = (await api.customers()).customers; else team = (await api.team()).team;
    if (p.id === me.id) renderMe();
    render(); openPerson(kind, (cust ? customers : team).find(x => x.id === p.id));
  };
  $("pPhotoPick")?.addEventListener("click", () => $("pPhoto").click());
  $("pPhoto")?.addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    const b = $("pPhotoPick"); b.disabled = true; b.textContent = "আপলোড হচ্ছে...";
    try { await api.avatarUpload(f, p.id); toast("ছবি আপডেট হয়েছে।"); await reopen(); } catch(err){ toast(err.message); b.disabled = false; b.textContent = "ছবি দিন"; }
  });
  $("pPhotoDel")?.addEventListener("click", async () => { try { await api.avatarRemove(p.id); toast("ছবি সরানো হয়েছে।"); await reopen(); } catch(err){ toast(err.message); } });
  $("pOrders")?.addEventListener("click", () => { closeDrawer(); oQuery = p.email; oFilter = "all"; go("orders"); });
}

/* ---------- team ---------- */
function renderTeam(){
  const devs = team.filter(t => t.role === "developer"), admins = team.filter(t => t.role === "admin");
  $("main").innerHTML = `
    <div class="sec-h"><div><h1>টিম ও ডেভেলপার</h1><p>ডেভেলপাররা শুধু তাদের দেওয়া প্রোজেক্ট দেখেন। অ্যাডমিন সব দেখেন, দাম আর পেমেন্ট বদলাতে পারেন।</p></div>
      <div class="tools"><button class="btn btn-primary btn-sm" type="button" id="addMember">${I.plus} নতুন মেম্বার</button></div></div>
    <div class="tiles">
      ${tile("মোট ডেভেলপার", nf(devs.length), nf(devs.filter(t => t.active).length) + " জন সক্রিয়")}
      ${tile("অ্যাডমিন", nf(admins.length), "সব কিছু দেখতে ও বদলাতে পারেন")}
      ${tile("চলমান প্রোজেক্ট", nf(team.reduce((s, t) => s + t.running, 0)), nf(stats?.orders?.unassigned || 0) + "টা এখনো অ্যাসাইন হয়নি")}
      ${tile("দেরি হচ্ছে", nf(team.reduce((s, t) => s + t.overdue, 0)), "ডেডলাইন পেরিয়ে গেছে")}
    </div>
    <div class="card" style="padding:10px 14px"><div class="tbl-wrap"><table class="tbl" style="min-width:700px"><thead><tr><th>নাম</th><th>রোল</th><th class="r">চলমান</th><th class="r">দেরি</th><th class="r">সম্পন্ন</th><th>অবস্থা</th><th></th></tr></thead><tbody>
      ${team.map(t => `<tr class="click" data-member="${t.id}"><td><div class="who-cell">${avatarHTML(t.name, t.avatar, "sm")}<div><b>${esc(t.name)}</b>${t.id === me.id ? ' <span class="badge b-admin">আপনি</span>' : ""}<span class="sub">${esc(t.email)}</span></div></div></td>
        <td>${t.role === "admin" ? "অ্যাডমিন" : "ডেভেলপার"}</td>
        <td class="r">${BN(t.running)}</td><td class="r ${t.overdue ? "late" : ""}">${BN(t.overdue)}</td><td class="r">${BN(t.done)}</td>
        <td>${t.active ? '<span class="badge b-done">সক্রিয়</span>' : '<span class="badge b-off">বন্ধ</span>'}</td>
        <td class="r"><button class="btn btn-ghost btn-sm" type="button" data-member="${t.id}">এডিট</button></td></tr>`).join("")}
    </tbody></table></div></div>`;
}
$("main").addEventListener("click", e => {
  if (sec !== "team") return;
  if (e.target.closest("#addMember")) return openPerson("team", null);
  const m = e.target.closest("[data-member]"); if (m) openPerson("team", team.find(t => t.id === +m.dataset.member));
});

/* ---------- customers ---------- */
const CF = {all: ["সব", () => true], active: ["এখন প্রোজেক্ট চলছে", c => c.running > 0], repeat: ["একাধিকবার অর্ডার", c => c.orders > 1], none: ["অর্ডার করেননি", c => !c.orders], blocked: ["বন্ধ", c => !c.active]};
function renderCustomers(){
  const q = custQ.toLowerCase();
  const list = customers.filter(CF[custF][1]).filter(c => !q || [c.name, c.email, c.phone].some(v => String(v || "").toLowerCase().includes(q)));
  const focus = document.activeElement?.id === "cq";
  const total = customers.reduce((s, c) => s + c.spent, 0), buyers = customers.filter(c => c.orders > 0), repeat = customers.filter(c => c.orders > 1).length;
  const month = Date.now() / 1000 - 30 * 86400;
  $("main").innerHTML = `
    <div class="sec-h"><div><h1>কাস্টমার</h1><p>কাস্টমার যোগ, এডিট, বন্ধ বা মুছে ফেলা যায়। কারো নামে ক্লিক করুন।</p></div>
      <div class="tools"><input class="search" type="search" id="cq" placeholder="নাম, ইমেইল, ফোন" value="${esc(custQ)}" aria-label="কাস্টমার খুঁজুন"><button class="btn btn-primary btn-sm" type="button" id="addCust">${I.plus} নতুন কাস্টমার</button></div></div>
    <div class="tiles">
      ${tile("মোট কাস্টমার", nf(customers.length), nf(customers.filter(c => c.created > month).length) + " জন গত ৩০ দিনে যোগ দিয়েছেন")}
      ${tile("অর্ডার করেছেন", nf(buyers.length), pct(buyers.length, customers.length) + " অ্যাকাউন্ট")}
      ${tile("আবার অর্ডার করেছেন", nf(repeat), pct(repeat, buyers.length) + " ক্রেতা ফিরে এসেছেন")}
      ${tile("কাস্টমার প্রতি গড় আয়", buyers.length ? tk(total / buyers.length) : "—", "মোট " + tk(total))}
    </div>
    <div class="chips" style="margin-bottom:14px">${Object.entries(CF).map(([k, [l, f]]) => `<button type="button" data-cf="${k}" aria-pressed="${custF === k}">${l} (${BN(customers.filter(f).length)})</button>`).join("")}</div>
    <div class="card" style="padding:10px 14px">${list.length ? `<div class="tbl-wrap"><table class="tbl" style="min-width:820px"><thead><tr><th>কাস্টমার</th><th>ফোন</th><th class="r">অর্ডার</th><th class="r">চলমান</th><th class="r">মোট পেমেন্ট</th><th>শেষ অর্ডার</th><th>অবস্থা</th><th></th></tr></thead><tbody>
      ${list.map(c => `<tr class="click" data-cust="${c.id}"><td><div class="who-cell">${avatarHTML(c.name, c.avatar, "sm")}<div><b>${esc(c.name)}</b><span class="sub">${esc(c.email)} · ${dateOnly(c.created)}</span></div></div></td><td>${esc(c.phone || "—")}</td><td class="r">${BN(c.orders)}</td><td class="r">${BN(c.running)}</td><td class="r num">${tk(c.spent)}</td><td>${c.last_order ? ago(c.last_order) : "—"}</td>
        <td>${c.active ? '<span class="badge b-done">সক্রিয়</span>' : '<span class="badge b-off">বন্ধ</span>'}</td><td class="r"><button class="btn btn-ghost btn-sm" type="button" data-cust="${c.id}">এডিট</button></td></tr>`).join("")}
    </tbody></table></div>` : `<p class="empty">${customers.length ? "কাউকে পাওয়া যায়নি।" : "লোড হচ্ছে..."}</p>`}</div>`;
  if (focus){ const i = $("cq"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}
$("main").addEventListener("click", e => {
  if (sec !== "customers") return;
  if (e.target.closest("#addCust")) return openPerson("customer", null);
  const f = e.target.closest("[data-cf]"); if (f){ custF = f.dataset.cf; return renderCustomers(); }
  const r = e.target.closest("[data-cust]"); if (r) openPerson("customer", customers.find(c => c.id === +r.dataset.cust));
});

/* ---------- boot ---------- */
async function boot(){
  if (!me) return showAuth();
  if (me.role !== "admin") return showAuth(`এই পেজ শুধু অ্যাডমিনের জন্য। আপনার প্রোজেক্টগুলো <a href="dashboard.html">ড্যাশবোর্ডে</a> দেখুন।`);
  $("auth").hidden = true; $("shell").hidden = false; $("logoutBtn").hidden = false; $("dashLink").hidden = false;
  sec = SECTIONS.some(([k]) => k === location.hash.slice(1)) ? location.hash.slice(1) : "overview";
  render();
  try { await loadAll(); } catch(e){ if (e.status === 401 || e.status === 403) return showAuth(); toast(e.message); return; }
  renderNav(); renderLive(); renderMe(); go(sec);
  setInterval(() => { if (!document.hidden) refreshStats(); }, 30000);
  setInterval(() => { if (!document.hidden && sec !== "catalog") refreshOrders().then(() => { if (["orders", "board"].includes(sec) && !document.activeElement?.closest("select,input")) render(); }); }, 60000);
}
(async () => {
  me = await api.init();
  $("demoBar").hidden = !api.demo;
  boot();
})();
</script>
</body>
</html>
